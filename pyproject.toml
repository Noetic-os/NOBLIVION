# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "noblivion"
version = "0.1.5"
description = "A Claude Code plugin for local memory recall, guards and a memory usage report."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The store venv (design doc 0001, sections 2 and 7): the vector leg and the
# default embedding backend. Without them the store ranks keyword-only.
embed = [
    "numpy>=1.24",
    "fastembed>=0.4",
]

[project.scripts]
noblivion = "noblivion.__main__:main"

[dependency-groups]
dev = [
    "numpy>=1.24",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noblivion"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.per-file-target-version]
# The hooks run on the user's python3, 3.9 or newer (design doc 0001, section 2).
"hooks/*.py" = "py39"
"mcp/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: multi-process load tests; CI runs them (deselect with -m 'not slow')",
]

[tool.ruff.lint.per-file-ignores]
# The hooks are moved from the reference implementation and run on python 3.9:
# they keep the `typing` aliases (Optional, List, ...), printf formatting and
# their long message strings, so the moved code stays comparable line by line.
"hooks/*.py" = ["E501", "UP006", "UP031", "UP035", "UP045"]
"mcp/*.py" = ["E501", "UP006", "UP031", "UP035", "UP045"]
