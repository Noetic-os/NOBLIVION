# SPDX-License-Identifier: AGPL-3.0-or-later
# Quality gates. Every job runs on GitHub-hosted runners only.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q

  # The shipped embedding model (noblivion[embed], fastembed) and the threshold
  # eval (NOBLIVION-33, NOBLIVION-48). The eval fails when precision or recall
  # at a shipped threshold drops under its floor in tools/eval/thresholds.json.
  # It measures the note text path, the ranked index of the shipped config
  # file, error recall in store and local mode, and the dedup cosine.
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOBLIVION_TEST_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra embed
      - name: Model cache folder
        run: echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5
      - name: Real-model tests
        run: uv run pytest -q tests/test_embedding.py tests/test_threshold_model.py
      - name: Threshold eval with the score gate
        run: uv run python tools/eval_thresholds.py --check

  # The full suite on macOS: the docs name Linux and macOS as supported.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  # The hooks and the MCP server claim Python 3.9 (the macOS system python3).
  # The package needs 3.10, so this job runs, without the package, every test
  # file that does not import it: the hooks, MCP and Codex adapter tests.
  test-py39:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tests without the package on Python 3.9
        run: |
          set -euo pipefail
          files=$(grep -L -E 'noblivion\.|from noblivion|import noblivion|src/noblivion' tests/test_*.py)
          test -n "$files"
          uv run --no-project --python 3.9 --with pytest pytest -q $files

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: CHANGELOG entry for shipped code (pull requests only)
        if: github.event_name == 'pull_request'
        run: python tools/check_changelog.py --base "origin/${{ github.base_ref }}"
      - name: No <owner> placeholder
        if: github.event_name != 'pull_request'
        run: python tools/check_changelog.py

  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks
      - name: gitleaks (full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v .
      # The real list is the repository secret NOBLIVION_FORBIDDEN_NAMES. A pull
      # request from a fork gets no secrets: the variable is empty, and the script
      # prints a notice and scans with tools/forbidden_names.example.txt only.
      - name: Forbidden names (tracked files)
        env:
          NOBLIVION_FORBIDDEN_NAMES: ${{ secrets.NOBLIVION_FORBIDDEN_NAMES }}
        run: python tools/check_forbidden_names.py
      - name: Forbidden names (full history)
        env:
          NOBLIVION_FORBIDDEN_NAMES: ${{ secrets.NOBLIVION_FORBIDDEN_NAMES }}
        run: python tools/check_forbidden_names.py --history

  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_spdx.py
